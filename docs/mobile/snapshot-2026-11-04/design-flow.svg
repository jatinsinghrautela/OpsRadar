="#8A77C6" stroke-width="2" marker-end="url(#arrow)"/><rect x="470" y="770" width="280" height="104" rx="20" fill="#FFFFFF" stroke="#DDD6EA"/><text x="490" y="814" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2D2846">Dark settings</text><text x="490" y="844" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#716780">Screen / Dark settings</text><text x="764" y="797" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#6250B8">Tap System</text><path d="M764 826h116" fill="none" stroke="#8A77C6" stroke-width="2" marker-end="url(#arrow)"/><rect x="900" y="770" width="280" height="104" rx="20" fill="#FFFFFF" stroke="#DDD6EA"/><text x="920" y="814" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2D2846">System settings</text><text x="920" y="844" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#716780">Screen / System settings</text><text x="1194" y="797" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#6250B8">Tap sun / moon</text><path d="M1194 826h116" fill="none" stroke="#8A77C6" stroke-width="2" marker-end="url(#arrow)"/><rect x="1330" y="770" width="280" height="104" rx="20" fill="#FFFFFF" stroke="#DDD6EA"/><text x="1350" y="814" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2D2846">Other-theme preview</text><text x="1350" y="844" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#716780">Screen / Other-theme preview</text><text x="40" y="974" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#6250B8">Other connected branches</text><text x="40" y="1007" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#2D2846">Temporary password → Change password → Verify identity → Inbox. Reset request → Sign in. Sign out → Sign in.</text><text x="40" y="1054" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#716780">System follows device appearance in the future app; the prototype shows a selected-state preview.</text><text x="40" y="1084" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#716780">Click through in Figma Present. Inspect native button connections in the Prototype tab.</text><text x="40" y="1114" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#716780">Standalone SVG fallback: the extra Figma flow-map page could not be populated because the free-plan tool limit was reached.</text></svg>