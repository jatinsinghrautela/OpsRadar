<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1160" viewBox="0 0 1740 1160"><title>OpsRadar Prism primary navigation map</title><desc>Labeled arrows show which action opens each screen. Native Figma prototype connections implement the main routes.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#8A77C6" stroke-width="1.5"/></marker></defs><rect width="1740" height="1160" rx="28" fill="#F4F2FB"/><text x="40" y="55" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#6250B8">OPSRADAR / PRISM</text><text x="40" y="111" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#2D2846">Every tap has a destination.</text><text x="40" y="150" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#716780">Main prototype routes · Light and Dark screen sets · Sample states only</text><text x="40" y="210" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#6250B8">SIGN IN AND READ</text><rect x="40" y="230" width="280" height="104" rx="20" fill="#FFFFFF" stroke="#DDD6EA"/><text x="60" y="274" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2D2846">Sign in</text><text x="60" y="304" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#716780">Screen / Sign in</text><text x="334" y="257" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#6250B8">Tap Sign in</text><path d="M334 286h116" fill="none" stroke="#8A77C6" stroke-width="2" marker-end="url(#arrow)"/><rect x="470" y="230" width="280" height="104" rx="20" fill="#FFFFFF" stroke="#DDD6EA"/><text x="490" y="274" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2D2846">Verify identity</text><text x="490" y="304" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#716780">Screen / Verify identity</text><text x="764" y="257" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#6250B8">Tap Verify and continue</text><path d="M764 286h116" fill="none" stroke="#8A77C6" stroke-width="2" marker-end="url(#arrow)"/><rect x="900" y="230" width="280" height="104" rx="20" fill="#FFFFFF" stroke="#DDD6EA"/><text x="920" y="274" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2D2846">Alert inbox</text><text x="920" y="304" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#716780">Screen / Alert inbox</text><text x="1194" y="257" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#6250B8">Tap alert card</text><path d="M1194 286h116" fill="none" stroke="#8A77C6" stroke-width="2" marker-end="url(#arrow)"/><rect x="1330" y="230" width="280" height="104" rx="20" fill="#FFFFFF" stroke="#DDD6EA"/><text x="1350" y="274" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2D2846">Alert details</text><text x="1350" y="304" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#716780">Screen / Alert details</text><text x="40" y="390" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#6250B8">REQUEST ACCESS</text><rect x="40" y="410" width="280" height="104" rx="20" fill="#FFFFFF" stroke="#DDD6EA"/><text x="60" y="454" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2D2846">My access</text><text x="60" y="484" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#716780">Screen / My access</text><text x="334" y="437" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#6250B8">Tap Request access</text><path d="M334 466h116" fill="none" stroke="#8A77C6" stroke-width="2" marker-end="url(#arrow)"/><rect x="470" y="410" width="280" height="104" rx="20" fill="#FFFFFF" stroke="#DDD6EA"/><text x="490" y="454" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2D2846">Find resources</text><text x="490" y="484" font-family